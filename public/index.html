<body>

  <div id="root"></div>

  <!-- ================= RAZORPAY ================= -->

  <!-- Razorpay SDK is loaded dynamically on the checkout page to reduce initial load -->

  <!-- ================= SMOOTH SCROLL JS ================= -->

  <script>
    document
      .querySelectorAll(
        'a[href^="#"]'
      )
      .forEach((anchor) => {

        anchor.addEventListener(
          "click",
          function (e) {

            e.preventDefault();

            const target =
              document.querySelector(
                this.getAttribute(
                  "href"
                )
              );

            if (target) {

              target.scrollIntoView({
                behavior: "smooth",
              });
            }
          }
        );
      });
  </script>
